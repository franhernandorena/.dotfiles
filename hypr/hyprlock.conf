# ────────────────────────────────────────────────────────────
#  Hyprlock — blurred screenshot background with input field
# ────────────────────────────────────────────────────────────

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 400, 60
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(15, 15, 15, 0.85)
    outer_color = rgba(200, 200, 200, 1.0)
    outline_thickness = 3

    font_family = ZedMono Nerd Font
    font_color = rgba(200, 200, 200, 1.0)

    placeholder_text = Enter Password
    check_color = rgba(68, 157, 171, 1.0)
    fail_color = rgba(204, 102, 102, 1.0)
    fail_text = Wrong password

    rounding = 8
    shadow_passes = 2
    shadow_size = 4
    fade_on_empty = false
}
